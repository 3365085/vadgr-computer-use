[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vadgr-computer-use"
version = "0.7.9"
description = "Local-first MCP server for desktop automation: screenshots, mouse, keyboard"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Santiago Montaño Diaz"}]
keywords = ["mcp", "computer-use", "automation", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
# One install, all tiers, the right deps per OS (no extras):
# `pip install vadgr-computer-use` pulls pixel + browser + structured support,
# and per-OS env markers gate the accessibility deps so each platform installs
# only what applies. The browser tier is stdlib sockets plus the bundled
# native-host relay (package data); the extension is NOT a pip dep.
dependencies = [
    "mcp>=2.0",
    "pillow>=10",
    "mss>=9",
    "uniseg>=0.10.1",                                                   # Unicode grapheme clusters for one timed input unit
    "python-xlib>=0.33; sys_platform == 'linux'",                       # pixel: X11 input via XTEST (pure-python, no xdotool)
    "jeepney>=0.8; sys_platform == 'linux'",                            # pure-python D-Bus
    "dbus-fast>=2.21; sys_platform == 'linux'",                         # structured: Linux AT-SPI (pure-python D-Bus, NOT pygobject)
    "pywinauto>=0.6.8; sys_platform == 'win32'",                        # structured: Windows UIA
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",            # pixel: macOS
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",  # structured: macOS AX
]

[project.optional-dependencies]
data-yaml = ["pyyaml>=6"]
# Linux uinput via the python-evdev package. Optional because evdev is sdist-only
# (needs a C toolchain): the default input fallback is the pure-python uinput
# writer in computer_use.platform.uinput, so a plain `pip install` never needs a
# compiler. Install this only to use the evdev-backed path.
linux-uinput = ["evdev>=1.6; sys_platform == 'linux'"]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
    "numpy==2.2.6; python_version == '3.10'",
    "scipy==1.15.3; python_version == '3.10'",
    "numpy==2.4.4; python_version >= '3.11'",
    "scipy==1.17.1; python_version >= '3.11'",
]
derivation = [
    "numpy==2.2.6; python_version == '3.10'",
    "scipy==1.15.3; python_version == '3.10'",
    "numpy==2.4.4; python_version >= '3.11'",
    "scipy==1.17.1; python_version >= '3.11'",
]

[project.scripts]
vadgr-cua = "computer_use.mcp_server:main"
vadgr-cua-host = "computer_use.browser.native_host:main"

[project.urls]
Homepage = "https://github.com/MONTBRAIN/vadgr-computer-use"
Repository = "https://github.com/MONTBRAIN/vadgr-computer-use"
Issues = "https://github.com/MONTBRAIN/vadgr-computer-use/issues"

[tool.setuptools.packages.find]
include = ["computer_use*"]
exclude = ["computer_use.tests*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"computer_use.core" = ["typing_profiles/*.json"]
# Native helpers are inserted only by the reviewed profile producer. A generic
# setuptools build must never inherit a legacy x64 helper or masquerade as a
# releasable 0.7.9 artifact.
# The udev rule `vadgr-cua install-deps` installs so /dev/uinput is writable by
# the 'input' group (the pure-python uinput fallback needs this).
"computer_use.setup" = ["udev/*.rules"]
# The GNOME Shell extension `vadgr-cua install-deps` installs per user: the
# on-screen indicator, Esc to stop, and screenshots without the portal flash.
"computer_use.platform" = [
    "gnome_extension/*/metadata.json",
    "gnome_extension/*/extension.js",
    "gnome_extension/*/stylesheet.css",
]

[tool.setuptools.exclude-package-data]
"*" = ["*.exe", "*.dll", "*.pyd", "*.zip", "*.ps1"]

[tool.pytest.ini_options]
testpaths = ["computer_use/tests", "scripts/tests", "scripts/scientific_tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E402: daemon.py sets DPI awareness before Win32 imports on purpose.
# The block below is deliberately-accepted style/robustness debt in the
# defensive automation + WSL-bridge code (broad best-effort error handling,
# subprocess wrappers that inspect returncode themselves, optional-param style).
# Not enforced; revisit as a dedicated cleanup, not a release blocker.
extend-ignore = [
    "E402", "E741", "F841",
    "BLE001",          # blind-except: intentional best-effort handlers
    "S110", "S112",    # try-except-pass / -continue: intentional best-effort
    "PLW1510",         # subprocess.run without check=: wrappers read returncode
    "RUF013",          # implicit Optional on default=None params
    "RUF012",          # mutable class default
    "RUF046",          # unnecessary int() cast
    "RUF059",          # unused unpacked variable
    "SIM102", "SIM117", "SIM118",  # collapsible-if / nested-with / in-dict-keys
    "PERF102",         # dict iterator style
    "B017",            # assert on broad Exception (in a test)
    "TRY004",          # type-check without TypeError
]

[tool.ruff.lint.per-file-ignores]
"computer_use/tests/*" = ["F401"]
